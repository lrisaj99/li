<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diatom Guy</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .scene {
      position: fixed;
      inset: 0;
      display: none;
      background-size: cover;
      background-position: center;
    }
    .scene.active {
      display: block;
    }

    #scene1 {
      background-image: url("assets/inside-scene.jpg");
    }

    .sprite {
      position: absolute;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Diatom guy on the left, hat sitting above him */
    #guy {
      left: 10%;
      bottom: 10%;
      height: 50vh;
    }
    #hat {
      left: 10%;
      bottom: 62%;
      height: 15vh;
      cursor: pointer;
    }

    /* Door on the right, hidden until the hat is clicked */
    #door {
      right: 10%;
      bottom: 10%;
      height: 60vh;
      display: none;
    }
    #door.visible {
      display: block;
    }

    #guy.draggable {
      cursor: grab;
      touch-action: none;
    }
    #guy.dragging {
      cursor: grabbing;
      animation: none;
    }

    .bob {
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    #scene2 {
      background: #000;
    }

    /* House on the left with the hatted guy standing in front of it */
    #house {
      left: 5%;
      bottom: 25%;
      height: 60vh;
    }
    #guy2 {
      left: 15%;
      bottom: 20%;
      height: 35vh;
      z-index: 1;
    }

    /* Car along the bottom of the screen */
    #car {
      left: 50%;
      bottom: 2%;
      height: 25vh;
      cursor: pointer;
      z-index: 2;
      translate: -50% 0;
      transition: left 1.5s ease-in;
    }
    #car.shake {
      animation: shake 0.1s linear infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      25%      { transform: translate(-2px, 1px) rotate(-0.5deg); }
      75%      { transform: translate(2px, -1px) rotate(0.5deg); }
    }
    #car.drive-off {
      left: 150%;
    }
  </style>
</head>
<body>
  <section id="scene1" class="scene active">
    <img id="guy" class="sprite" src="assets/diatom-guy.png" alt="Diatom guy">
    <img id="hat" class="sprite bob" src="assets/hat.png" alt="Hat">
    <img id="door" class="sprite" src="assets/door.png" alt="Door">
  </section>

  <section id="scene2" class="scene">
    <img id="house" class="sprite" src="assets/house.png" alt="House">
    <img id="guy2" class="sprite" src="assets/diatom-guy-with-hat.png" alt="Diatom guy with hat">
    <img id="car" class="sprite" src="assets/car.png" alt="Car">
  </section>

  <script>
    const guy = document.getElementById("guy");
    const hat = document.getElementById("hat");
    const door = document.getElementById("door");

    function showScene(id) {
      document.querySelectorAll(".scene").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // Clicking the hat puts it on the guy and reveals the door
    hat.addEventListener("click", () => {
      guy.src = "assets/diatom-guy-with-hat.png";
      hat.style.display = "none";
      door.classList.add("visible");
      guy.classList.add("bob", "draggable");
    });

    // Dragging the hatted guy onto the door starts Scene 2
    let startX, startY, dragging = false;

    guy.addEventListener("pointerdown", e => {
      if (!guy.classList.contains("draggable")) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      guy.classList.add("dragging");
      guy.setPointerCapture(e.pointerId);
    });

    guy.addEventListener("pointermove", e => {
      if (!dragging) return;
      guy.style.transform = `translate(${e.clientX - startX}px, ${e.clientY - startY}px)`;
    });

    guy.addEventListener("pointerup", e => {
      if (!dragging) return;
      dragging = false;

      // Measure before re-enabling the bob animation, which overrides the drag offset
      const g = guy.getBoundingClientRect();
      const d = door.getBoundingClientRect();
      const overlaps = g.left < d.right && g.right > d.left &&
                       g.top < d.bottom && g.bottom > d.top;

      guy.classList.remove("dragging");
      guy.style.transform = "";
      if (overlaps) showScene("scene2");
    });

    // Clicking the car puts the guy in it; it shakes, then drives off to the right
    const guy2 = document.getElementById("guy2");
    const car = document.getElementById("car");
    let carStarted = false;

    car.addEventListener("click", () => {
      if (carStarted) return;
      carStarted = true;
      guy2.style.display = "none";
      car.src = "assets/car-with-driver.png";
      car.classList.add("shake");

      setTimeout(() => car.classList.add("drive-off"), 1000);
    });
  </script>
</body>
</html>
